[workspace]
resolver = "2"
members = ["crates/xbwrite-core", "crates/xbwrite", "crates/xbwrite-cli"]
# The upstream xdvdfs checkout is its own workspace; we only use its core crate as a path dependency.
exclude = ["xdvdfs"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
